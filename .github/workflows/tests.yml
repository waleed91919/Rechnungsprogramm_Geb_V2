name: Node regression tests

on:
  pull_request:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install without Electron rebuild
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build SQLite for the Node test runtime
        run: npm rebuild better-sqlite3
      - name: Run all tests
        run: npm test
