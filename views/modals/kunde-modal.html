        <div id="kunde-modal"
            class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
            <div
                class="bg-white rounded-lg shadow-xl w-full max-w-md border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
                <div class="flex justify-between items-center px-6 py-4 border-b border-slate-200 bg-slate-50">
                    <h3 id="kunde-modal-title" class="text-lg font-semibold text-slate-800">Neuer Kunde</h3>
                    <button onclick="closeKundeModal()" class="text-slate-400 hover:text-slate-600">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto">
                    <form id="kunde-form" class="flex flex-col gap-4">
                        <input type="hidden" id="kunde-id">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Kundennummer</label>
                            <input type="text" id="kunde-kundennummer" required readonly
                                class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-md text-sm text-slate-600 font-mono"
                                placeholder="Wird automatisch generiert...">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Firmen-/Name</label>
                            <input type="text" id="kunde-name" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Adresse</label>
                            <input type="text" id="kunde-adresse" required
                                class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">PLZ</label>
                                <input type="text" id="kunde-plz" required
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Ort</label>
                                <input type="text" id="kunde-ort" required
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Telefonnummer</label>
                                <input type="text" id="kunde-telefon"
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">E-Mail-Adresse</label>
                                <input type="email" id="kunde-email"
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Kundentyp / Rechnungsstandard</label>
                                <select id="kunde-customer-type" onchange="toggleKundeTypeFields()"
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm font-semibold bg-slate-50">
                                    <option value="B2C">B2C (Privatkunde - § 35a EStG)</option>
                                    <option value="B2B">B2B (Gewerbekunde - § 13b UStG / § 48b)</option>
                                    <option value="B2G">B2G (Öffentlicher Auftraggeber / Behörde - EN 16931)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">USt-IdNr. <span
                                        class="text-slate-400 font-normal">(Optional)</span></label>
                                <input type="text" id="kunde-ustid"
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm "
                                    placeholder="z.B. DE123456789">
                            </div>
                        </div>

                        <!-- B2G Spezifische Felder -->
                        <div id="kunde-b2g-fields" class="bg-blue-50/70 border border-blue-200 rounded-lg p-3 space-y-3">
                            <p class="text-xs font-bold text-blue-900 flex items-center gap-1 uppercase tracking-wider">
                                <span class="material-symbols-outlined text-[16px] text-blue-600">account_balance</span>
                                B2G E-Rechnungs-Stammdaten (EN 16931 / XRechnung)
                            </p>
                            <div>
                                <label class="block text-xs font-semibold text-blue-900 mb-1">Leitweg-ID <span class="text-red-500">*</span></label>
                                <input type="text" id="kunde-leitweg-id" placeholder="z.B. 991-12345678-12"
                                    class="w-full px-3 py-1.5 border border-blue-300 rounded text-sm bg-white font-mono">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-blue-900 mb-1">Buyer Reference / Aktenzeichen</label>
                                    <input type="text" id="kunde-buyer-reference" placeholder="z.B. AB-45001"
                                        class="w-full px-3 py-1.5 border border-blue-300 rounded text-sm bg-white font-mono">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-blue-900 mb-1">PEPPOL-ID</label>
                                    <input type="text" id="kunde-peppol-id" placeholder="z.B. 0204:DE..."
                                        class="w-full px-3 py-1.5 border border-blue-300 rounded text-sm bg-white font-mono">
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 border-t border-slate-100 pt-4 mt-2">
                            <div>
                                <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer">
                                    <input type="checkbox" id="kunde-ist-bauleistender-13b" class="rounded border-slate-300 text-primary focus:ring-primary h-4 w-4">
                                    <span>Bauleistender (§13b UStG)</span>
                                </label>
                                <label class="block text-sm font-medium text-slate-700 mt-2 mb-1">Gültig bis</label>
                                <input type="date" id="kunde-ust-1-tg-gueltig-bis"
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                            </div>
                            <div>
                                <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer">
                                    <input type="checkbox" id="kunde-hat-freistellungsbescheinigung" class="rounded border-slate-300 text-primary focus:ring-primary h-4 w-4">
                                    <span>Freistellungsbescheinigung</span>
                                </label>
                                <label class="block text-sm font-medium text-slate-700 mt-2 mb-1">Gültig bis</label>
                                <input type="date" id="kunde-freistellung-gueltig-bis"
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                                <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer mt-2">
                                    <input type="checkbox" id="kunde-ist-subunternehmer" class="rounded border-slate-300 text-primary focus:ring-primary h-4 w-4">
                                    <span>Subunternehmer (§ 48b EStG)</span>
                                </label>
                            </div>
                        </div>

                        <div class="pt-2">
                            <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer">
                                <input type="checkbox" id="kunde-ist-umsatzsteuerfreie-vermietung" class="rounded border-slate-300 text-primary focus:ring-primary h-4 w-4">
                                <span>Steuerfreie Vermietung (Ohne MwSt.)</span>
                            </label>
                        </div>

                        <!-- SEPA & Bankverbindung -->
                        <div class="border-t border-slate-100 pt-3 mt-1 space-y-3">
                            <p class="text-xs font-bold text-slate-700 flex items-center gap-1 uppercase tracking-wider">
                                <span class="material-symbols-outlined text-[16px] text-primary">account_balance</span>
                                Bankverbindung &amp; SEPA-Lastschrift
                            </p>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">IBAN</label>
                                    <input type="text" id="kunde-iban" placeholder="DE89 3704 0044 0532 0130 00"
                                        class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm font-mono">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">BIC</label>
                                    <input type="text" id="kunde-bic" placeholder="COBADEFFXXX"
                                        class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm font-mono">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">Bankname</label>
                                    <input type="text" id="kunde-bank-name" placeholder="z. B. Sparkasse"
                                        class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-700 mb-1">Kontoinhaber</label>
                                    <input type="text" id="kunde-kontoinhaber" placeholder="Falls abweichend"
                                        class="w-full px-3 py-1.5 border border-slate-300 rounded text-sm">
                                </div>
                            </div>
                        </div>

                        <!-- Quick Paste Section -->
                        <div class="mt-2 pt-4 border-t border-slate-100">
                            <button type="button" onclick="toggleQuickPaste()"
                                class="flex items-center gap-1.5 text-xs font-semibold text-primary hover:text-primary-dark transition-colors">
                                <span class="material-symbols-outlined text-[16px]">content_paste</span>
                                Text einfügen (Schnell-Ausfüllen)
                            </button>
                            <div id="quick-paste-container" class="hidden mt-2">
                                <textarea id="kunde-quick-paste" rows="4"
                                    class="w-full px-2 py-1.5 border border-slate-200 rounded text-xs font-mono bg-slate-50 focus:bg-white focus:ring-1 focus:ring-primary outline-none resize-none"
                                    placeholder="Name&#10;Strasse&#10;PLZ Ort&#10;Telefon&#10;Email&#10;USt-IdNr"
                                    oninput="processQuickPaste(this.value)"></textarea>
                                <p class="text-xs text-slate-500 mt-1 font-medium">Einfach Textblock hier einfügen (Strg + V), die Felder
                                    füllen sich automatisch.</p>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3 shrink-0">
                    <button onclick="closeKundeModal()" type="button"
                        class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50">Abbrechen</button>
                    <button onclick="saveKunde()" type="button"
                        class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-md hover:bg-primary-dark shadow-sm">Speichern</button>
                </div>
            </div>
        </div>
