        <div id="bank-konto-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden border border-slate-100">
                <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                    <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary">account_balance</span>
                        Bankkonto bearbeiten
                    </h3>
                    <button onclick="schliesseBankKontoModal()" class="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <div class="p-6 flex flex-col gap-4">
                    <input type="hidden" id="bank-konto-id">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Kontobezeichnung *</label>
                        <input type="text" id="bank-konto-name" placeholder="z. B. Geschäftskonto Haupt"
                            class="w-full text-xs border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Bankname</label>
                            <input type="text" id="bank-konto-bankname" placeholder="z. B. Sparkasse KölnBonn"
                                class="w-full text-xs border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Kontoinhaber *</label>
                            <input type="text" id="bank-konto-inhaber" placeholder="Firma Mustermann GmbH"
                                class="w-full text-xs border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">IBAN *</label>
                            <input type="text" id="bank-konto-iban" placeholder="DE89 3704 0044 0532 0130 00"
                                class="w-full text-xs font-mono border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">BIC</label>
                            <input type="text" id="bank-konto-bic" placeholder="COBADEFFXXX"
                                class="w-full text-xs font-mono border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Gläubiger-Identifikationsnummer (CI für SEPA)</label>
                        <input type="text" id="bank-konto-glaeubiger" placeholder="DE98ZZZ09999999999"
                            class="w-full text-xs font-mono border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                    </div>
                    <div class="flex items-center gap-2 pt-2">
                        <input type="checkbox" id="bank-konto-standard" class="rounded border-slate-300 text-primary focus:ring-primary">
                        <label for="bank-konto-standard" class="text-xs text-slate-700 font-medium">Als Standard-Bankkonto verwenden</label>
                    </div>
                </div>
                <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                    <button onclick="schliesseBankKontoModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-medium">Abbrechen</button>
                    <button onclick="speichereBankKontoForm()" class="px-4 py-2 bg-primary hover:bg-primary-dark text-white rounded-lg text-xs font-medium">Speichern</button>
                </div>
            </div>
        </div>
