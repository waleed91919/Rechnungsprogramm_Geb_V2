    <div id="steuerbericht-modal"
        class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[150] hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">assessment</span>
                    Steuerbericht Export
                </h3>
                <button onclick="closeSteuerberichtModal()" class="text-slate-400 hover:text-slate-600">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6">
                <p class="text-sm text-slate-600 mb-6 leading-relaxed">
                    Wählen Sie das gewünschte Exportformat für den Zeitraum <span id="steuerbericht-period-label" class="font-bold text-slate-800">...</span>.
                </p>
                <div class="grid grid-cols-1 gap-4">
                    <button onclick="exportSteuerberichtPDF()"
                        class="flex items-center gap-4 p-4 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition-all group text-left">
                        <div class="p-3 bg-red-100 text-red-600 rounded-lg group-hover:bg-red-600 group-hover:text-white transition-colors">
                            <span class="material-symbols-outlined">picture_as_pdf</span>
                        </div>
                        <div>
                            <p class="font-bold text-slate-800">PDF</p>
                            <p class="text-xs text-slate-500">Zum Drucken und Archivieren (Offizieller Bericht)</p>
                        </div>
                    </button>
                    <button onclick="printTaxReport(true);"
                        class="flex items-center gap-4 p-4 rounded-xl border border-slate-200 hover:border-slate-500 hover:bg-slate-50 transition-all group text-left">
                        <div class="p-3 bg-slate-100 text-slate-600 rounded-lg group-hover:bg-slate-600 group-hover:text-white transition-colors">
                            <span class="material-symbols-outlined">print</span>
                        </div>
                        <div>
                            <p class="font-bold text-slate-800">Einfacher Ausdruck</p>
                            <p class="text-xs text-slate-500">Kompakte Liste ohne Grafiken</p>
                        </div>
                    </button>
                    <button onclick="exportSteuerberichtCSV()"
                        class="flex items-center gap-4 p-4 rounded-xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50 transition-all group text-left">
                        <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                            <span class="material-symbols-outlined">table_chart</span>
                        </div>
                        <div>
                            <p class="font-bold text-slate-800">CSV exportieren</p>
                            <p class="text-xs text-slate-500">Für DATEV / Excel (Semikolon-getrennt, Deutsch)</p>
                        </div>
                    </button>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end">
                <button onclick="closeSteuerberichtModal()"
                    class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-slate-800 transition-colors">
                    Abbrechen
                </button>
            </div>
        </div>
    </div>
