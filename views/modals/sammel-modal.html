        <div id="sammel-modal"
            class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
            <div
                class="bg-white rounded-lg shadow-xl w-full max-w-xl border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
                <div class="flex justify-between items-center px-6 py-4 border-b border-slate-200 bg-slate-50">
                    <h3 class="text-lg font-semibold text-slate-800">Sammelrechnung erstellen</h3>
                    <button onclick="closeSammelModal()" class="text-slate-400 hover:text-slate-600">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto flex-1 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Rechnungsempfänger (mit ≥ 2 offenen Läufen)</label>
                        <select id="sammel-modal-empfaenger" onchange="renderSammelLaeufe()"
                            class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                            <option value="">Bitte wählen...</option>
                        </select>
                    </div>
                    <div id="sammel-laeufe-liste" class="flex flex-col gap-1.5"></div>
                    <p id="sammel-hinweis" class="text-xs text-slate-400"></p>
                </div>
                <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3 shrink-0">
                    <button onclick="closeSammelModal()" type="button"
                        class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50">Abbrechen</button>
                    <button onclick="fuehreSammelrechnungAus()" type="button"
                        class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-md hover:bg-primary-dark shadow-sm">Sammelrechnung erstellen</button>
                </div>
            </div>
        </div>
