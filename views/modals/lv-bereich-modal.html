        <div id="lv-bereich-modal"
            class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-md border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
                <div class="flex justify-between items-center px-6 py-4 border-b border-slate-200 bg-slate-50">
                    <h3 id="lv-bereich-modal-title" class="text-lg font-semibold text-slate-800">Leistungsbereich anlegen</h3>
                    <button onclick="closeLvBereichModal()" class="text-slate-400 hover:text-slate-600">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto">
                    <form id="lv-bereich-form" class="flex flex-col gap-4">
                        <input type="hidden" id="lv-bereich-modal-id">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Name <span class="text-red-500">*</span></label>
                            <input type="text" id="lv-bereich-modal-name" required autofocus placeholder="z.B. Unterhaltsreinigung"
                                class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Positionsnummern-Präfix</label>
                                <input type="text" id="lv-bereich-modal-prefix" placeholder="z.B. 01."
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm font-mono">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Sortierung</label>
                                <input type="number" id="lv-bereich-modal-sortier" value="0"
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Notizen / Qualitätsstandards</label>
                            <textarea id="lv-bereich-modal-notizen" rows="2"
                                class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm resize-none"></textarea>
                        </div>
                        <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer">
                            <input type="checkbox" id="lv-bereich-modal-aktiv" checked class="rounded border-slate-300 text-primary focus:ring-primary h-4 w-4">
                            <span>Aktiv</span>
                        </label>
                    </form>
                </div>
                <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3 shrink-0">
                    <button onclick="closeLvBereichModal()" type="button"
                        class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50">Abbrechen</button>
                    <button onclick="saveLvBereichFromModal()" type="button"
                        class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-md hover:bg-primary-dark shadow-sm">Speichern</button>
                </div>
            </div>
        </div>
