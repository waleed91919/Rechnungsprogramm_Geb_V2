    <div id="mahnung-modal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span class="material-symbols-outlined text-amber-500">gavel</span>
                    Mahnstufe auswählen
                </h3>
                <button onclick="closeMahnungModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="p-6">
                <input type="hidden" id="mahnung-rechnung-id">
                <label class="block text-sm font-medium text-slate-700 mb-2">Bitte wählen Sie die gewünschte Mahnstufe:</label>
                <select id="mahnung-level-select"
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary text-sm shadow-sm transition-all">
                    <option value="1">1. Zahlungserinnerung</option>
                    <option value="2">2. Mahnung</option>
                    <option value="3">3. & Letzte Mahnung (Inkasso)</option>
                </select>
            </div>
            <div class="p-6 bg-slate-50 flex justify-end gap-3">
                <button onclick="closeMahnungModal()" 
                    class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 transition-colors">
                    Abbrechen
                </button>
                <button onclick="confirmMahnungLevel()" 
                    class="px-6 py-2 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold rounded-xl shadow-md shadow-amber-500/20 transition-all">
                    Mahnung erstellen
                </button>
            </div>
        </div>
    </div>
