        <div id="abnahme-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
                <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <span class="material-symbols-outlined text-emerald-600">verified</span>
                        Abnahmeprotokoll (VOB/B § 12 / BGB § 640)
                    </h3>
                    <button type="button" onclick="closeAbnahmeModal()" class="text-slate-400 hover:text-slate-600">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto flex-1 space-y-4">
                    <input type="hidden" id="abn-id">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Abnahmedatum</label>
                            <input type="date" id="abn-datum" class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Ort der Abnahme</label>
                            <input type="text" id="abn-ort" placeholder="Baustelle / Ort" class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Abnahmeergebnis</label>
                            <select id="abn-status" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white font-semibold">
                                <option value="OHNE_VORBEHALT">Abnahme ohne Vorbehalt erteilt</option>
                                <option value="MIT_VORBEHALT">Abnahme mit Mängelvorbehalt erteilt</option>
                                <option value="VERWEIGERT">Abnahme wegen wesentlicher Mängel verweigert</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Vertreter Auftraggeber (AG)</label>
                            <input type="text" id="abn-ag-vertreter" placeholder="Name AG Vertreter" class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Vertreter Auftragnehmer (AN)</label>
                            <input type="text" id="abn-an-vertreter" placeholder="Name AN Bauleiter" class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
                        </div>
                    </div>

                    <!-- Mängelliste -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-semibold text-slate-700">Festgestellte Mängel & Beseitigungsfristen</label>
                            <button type="button" onclick="addMangelRow()" class="text-xs text-emerald-600 font-bold hover:underline flex items-center gap-1">
                                <span class="material-symbols-outlined text-[14px]">add</span> Mangel erfassen
                            </button>
                        </div>
                        <div id="abn-maengel-list" class="space-y-2">
                            <!-- JS populated -->
                        </div>
                    </div>

                    <!-- Digitale Signatur Canvas -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-200">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1 flex justify-between">
                                <span>Unterschrift Auftraggeber</span>
                                <button type="button" onclick="clearCanvas('signature-ag')" class="text-slate-400 hover:text-slate-600 text-[11px]">Löschen</button>
                            </label>
                            <canvas id="signature-ag" width="360" height="120" class="border border-slate-300 rounded-lg bg-slate-50 w-full cursor-crosshair"></canvas>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1 flex justify-between">
                                <span>Unterschrift Auftragnehmer</span>
                                <button type="button" onclick="clearCanvas('signature-an')" class="text-slate-400 hover:text-slate-600 text-[11px]">Löschen</button>
                            </label>
                            <canvas id="signature-an" width="360" height="120" class="border border-slate-300 rounded-lg bg-slate-50 w-full cursor-crosshair"></canvas>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                    <button type="button" onclick="closeAbnahmeModal()" class="px-4 py-2 bg-white border border-slate-300 text-slate-700 text-xs font-bold rounded-lg hover:bg-slate-50">Abbrechen</button>
                    <button type="button" onclick="saveAbnahmeprotokollData()" class="px-5 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow hover:bg-emerald-700">Abnahmeprotokoll abschließen</button>
                </div>
            </div>
        </div>
