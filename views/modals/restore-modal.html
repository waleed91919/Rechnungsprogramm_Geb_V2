    <div id="restore-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[250] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 overflow-hidden transform transition-all">
            <div class="p-8 text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <span class="material-symbols-outlined text-red-600 text-4xl">warning</span>
                </div>
                <h3 class="text-xl font-bold text-slate-900 mb-2">Achtung!</h3>
                <p class="text-slate-600 mb-6 leading-relaxed text-sm">
                    Das Wiederherstellen eines Backups überschreibt alle aktuellen Daten unwiderruflich. <br>
                    <strong>Alle aktuellen Daten werden gelöscht!</strong>
                </p>
                
                <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6 text-left">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Zur Bestätigung 'BESTÄTIGEN' eingeben:</p>
                    <input type="text" id="restore-confirm-input" 
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500/20 focus:border-red-500 text-center font-bold tracking-widest outline-none transition-all"
                        placeholder="BESTÄTIGEN" autocomplete="off">
                </div>

                <div class="flex gap-3">
                    <button onclick="closeRestoreModal()" 
                        class="flex-1 px-4 py-3 text-sm font-semibold text-slate-700 bg-white border border-slate-300 rounded-xl hover:bg-slate-50 transition-all">
                        Abbrechen
                    </button>
                    <button id="restore-confirm-btn" onclick="handleRestoreBackup()" disabled
                        class="flex-1 px-4 py-3 text-sm font-semibold text-white bg-red-600 rounded-xl hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-red-600/20 transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[18px]">restore</span>
                        Wiederherstellen
                    </button>
                </div>
            </div>
        </div>
    </div>
