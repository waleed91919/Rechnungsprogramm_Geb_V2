        <div id="lv-eintrag-modal"
            class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-md border border-slate-200 overflow-hidden flex flex-col max-h-[90vh]">
                <div class="flex justify-between items-center px-6 py-4 border-b border-slate-200 bg-slate-50">
                    <h3 id="lv-eintrag-modal-title" class="text-lg font-semibold text-slate-800">Objekt zuweisen</h3>
                    <button onclick="closeLvEintragModal()" class="text-slate-400 hover:text-slate-600">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto">
                    <form id="lv-eintrag-form" class="flex flex-col gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Liegenschaft / Gebäude / Etage / Raum <span class="text-red-500">*</span></label>
                            <select id="lv-eintrag-modal-objekt"
                                class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm"></select>
                        </div>
                        <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer">
                            <input type="checkbox" id="lv-eintrag-modal-auto" checked onchange="toggleEintragOverride()"
                                class="rounded border-slate-300 text-primary focus:ring-primary h-4 w-4">
                            <span>Fläche/Menge automatisch aus Objektstamm übernehmen</span>
                        </label>
                        <div id="lv-eintrag-modal-override-wrap" class="hidden">
                            <label class="block text-sm font-medium text-slate-700 mb-1">Menge überschreiben</label>
                            <input type="number" id="lv-eintrag-modal-menge" min="0" step="0.01" value="0"
                                class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Turnus</label>
                                <select id="lv-eintrag-modal-turnus-typ"
                                    class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                                    <option value="X_PRO_WOCHE">× pro Woche</option>
                                    <option value="ALLE_X_TAGE">alle … Tage</option>
                                    <option value="X_PRO_MONAT">× pro Monat</option>
                                    <option value="JAEHRLICH">× pro Jahr</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Turnus-Wert</label>
                                <input type="number" id="lv-eintrag-modal-turnus-wert" min="0.5" step="0.5" value="1"
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Notizen</label>
                            <input type="text" id="lv-eintrag-modal-notizen"
                                class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-1 focus:ring-primary focus:border-primary text-sm">
                        </div>
                    </form>
                </div>
                <div class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3 shrink-0">
                    <button onclick="closeLvEintragModal()" type="button"
                        class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md hover:bg-slate-50">Abbrechen</button>
                    <button onclick="saveLvEintragFromModal()" type="button"
                        class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-md hover:bg-primary-dark shadow-sm">Übernehmen</button>
                </div>
            </div>
        </div>
