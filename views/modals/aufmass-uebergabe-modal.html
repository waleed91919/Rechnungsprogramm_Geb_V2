        <div id="aufmass-uebergabe-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden">
                <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <span class="material-symbols-outlined text-amber-600">drive_file_move</span>
                        Aufmaß in Dokument übergeben
                    </h3>
                    <button type="button" onclick="closeAufmassUebergabeModal()" class="text-slate-400 hover:text-slate-600">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <div class="p-6 overflow-y-auto flex-1 space-y-4 text-sm">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">1. Ziel-Dokumentart wählen</label>
                        <select id="uebergabe-ziel-typ" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white font-medium" onchange="onUebergabeTypChange()">
                            <option value="ABSCHLAG">Abschlagsrechnung / Teilrechnung</option>
                            <option value="SCHLUSSRECHNUNG">Schlussrechnung</option>
                            <option value="ANGEBOT">Angebot</option>
                            <option value="AUFTRAG">Auftragsbestätigung</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">2. Dokumenten-Aktion</label>
                        <div class="space-y-2">
                            <label class="flex items-center gap-2 p-3 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-100">
                                <input type="radio" name="uebergabe-modus" value="UPDATE_EXISTING" checked class="text-primary">
                                <div>
                                    <span class="font-bold text-slate-800 text-xs block">Mengen im bestehenden Entwurf aktualisieren</span>
                                    <span class="text-[11px] text-slate-500">Übernimmt die ermittelten Aufmaßmengen in die passenden Positionen.</span>
                                </div>
                            </label>
                            <label class="flex items-center gap-2 p-3 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-100">
                                <input type="radio" name="uebergabe-modus" value="CREATE_NEW" class="text-primary">
                                <div>
                                    <span class="font-bold text-slate-800 text-xs block">Neues Rechnungsdokument erzeugen</span>
                                    <span class="text-[11px] text-slate-500">Erstellt ein neues Dokument direkt mit den aggregierten Aufmaßen.</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div id="uebergabe-doc-select-container">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ziel-Dokument wählen</label>
                        <select id="uebergabe-doc-select" class="w-full px-3 py-2 border border-slate-300 rounded text-sm bg-white font-medium">
                            <!-- JS populated -->
                        </select>
                    </div>
                </div>

                <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                    <button type="button" onclick="closeAufmassUebergabeModal()" class="px-4 py-2 bg-white border border-slate-300 text-slate-700 text-xs font-bold rounded-lg hover:bg-slate-50">Abbrechen</button>
                    <button type="button" onclick="executeAufmassUebergabe()" class="px-5 py-2 bg-amber-600 text-white text-xs font-bold rounded-lg shadow hover:bg-amber-700">Übergabe durchführen</button>
                </div>
            </div>
        </div>
