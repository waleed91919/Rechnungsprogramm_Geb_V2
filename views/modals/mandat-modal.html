        <div id="mandat-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">

                        <span class="material-symbols-outlined text-primary">history_edu</span>

                </div>
                <div class="p-6 flex flex-col gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Kunde *</label>
                        <select id="mandat-kunde" class="w-full text-xs border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Mandatsreferenz *</label>

                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Unterschriftsdatum *</label>

                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Typ</label>
                            <select id="mandat-typ" class="w-full text-xs border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">

                                <option value="B2B">B2B (Firmenlastschrift)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Sequenztyp</label>
                            <select id="mandat-sequenz" class="w-full text-xs border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                                <option value="FRST" selected>FRST (Erstlastschrift)</option>
                                <option value="RCUR">RCUR (Folgelastschrift)</option>
                                <option value="FNAL">FNAL (Letztlastschrift)</option>
                                <option value="OOFF">OOFF (Einmal-LASTSCHRIFT)</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">IBAN *</label>
                            <input type="text" id="mandat-iban" placeholder="DE89 3704 0044 0532 0130 00"
                                class="w-full text-xs font-mono border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">BIC</label>
                            <input type="text" id="mandat-bic" placeholder="COBADEFFXXX"
                                class="w-full text-xs font-mono border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Kontoinhaber *</label>
                            <input type="text" id="mandat-kontoinhaber" placeholder="Firma Mustermann GmbH"
                                class="w-full text-xs border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Bankname</label>
                            <input type="text" id="mandat-bankname" placeholder="z. B. Sparkasse KölnBonn"
                                class="w-full text-xs border border-slate-200 rounded-lg focus:ring-primary focus:border-primary py-2 px-3">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Pre-Notification-Tage</label>
                            <input type="number" id="mandat-prenot-tage" value="14" min="1"

                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Bemerkung</label>
                            <input type="text" id="mandat-bemerkung" placeholder="optional"

                        </div>
                    </div>
                </div>
                <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                    <button onclick="schliesseMandatModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-medium">Abbrechen</button>
                    <button onclick="speichereMandatForm()" class="px-4 py-2 bg-primary hover:bg-primary-dark text-white rounded-lg text-xs font-medium">Speichern</button>
                </div>
            </div>
        </div>
