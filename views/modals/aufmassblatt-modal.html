        <div id="aufmassblatt-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
                <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary">square_foot</span>
                        Aufmaßblatt bearbeiten
                    </h3>
                    <button type="button" onclick="closeAufmassBlattModal()" class="text-slate-400 hover:text-slate-600">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto flex-1 space-y-4">
                    <input type="hidden" id="ab-id">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Blatt-Nummer</label>
                            <input type="text" id="ab-nummer" placeholder="001" class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-semibold text-slate-600 mb-1">Titel / Bezeichnung</label>
                            <input type="text" id="ab-titel" placeholder="z.B. Innenputz & Trockenbau EG" class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-semibold text-slate-700">Aufmaßzeilen (REB 23.003 & freie Formeln)</label>
                            <button type="button" onclick="addAufmassBlattZeile()" class="text-xs text-primary font-bold hover:underline flex items-center gap-1">
                                <span class="material-symbols-outlined text-[14px]">add</span> Zeile hinzufügen
                            </button>
                        </div>
                        <div class="border border-slate-200 rounded-lg overflow-x-auto">
                            <table class="w-full text-left text-xs whitespace-nowrap">
                                <thead class="bg-slate-100 text-slate-700 font-semibold">
                                    <tr>
                                        <th class="px-3 py-2 w-24">OZ Code</th>
                                        <th class="px-3 py-2">Bezeichnung / Raum</th>
                                        <th class="px-3 py-2 w-48">Rechenansatz (z.B. 4.5*3.2*0.25)</th>
                                        <th class="px-3 py-2 w-20 text-center">Einheit</th>
                                        <th class="px-3 py-2 w-20 text-center">Vorzeichen</th>
                                        <th class="px-3 py-2 w-24 text-right">Ergebnis</th>
                                        <th class="px-2 py-2 w-8"></th>
                                    </tr>
                                </thead>
                                <tbody id="ab-zeilen-body" class="divide-y divide-slate-100 bg-white">
                                    <!-- JS populated -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                    <div class="text-sm font-bold text-slate-700">
                        Summe Blatt: <span id="ab-total-sum" class="text-primary font-mono text-base">0.00</span>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" onclick="printCurrentAufmassBlattModal()" class="flex items-center gap-1.5 px-4 py-2 bg-slate-100 border border-slate-300 text-slate-700 text-xs font-bold rounded-lg hover:bg-slate-200 shadow-sm transition-all" title="Aufmaßblatt drucken oder als PDF exportieren">
                            <span class="material-symbols-outlined text-[16px]">print</span>
                            Drucken / PDF
                        </button>
                        <button type="button" onclick="closeAufmassBlattModal()" class="px-4 py-2 bg-white border border-slate-300 text-slate-700 text-xs font-bold rounded-lg hover:bg-slate-50">Abbrechen</button>
                        <button type="button" onclick="saveAufmassBlattData()" class="px-5 py-2 bg-primary text-white text-xs font-bold rounded-lg shadow hover:bg-primary-dark">Aufmaßblatt speichern</button>
                    </div>
                </div>
            </div>
        </div>
