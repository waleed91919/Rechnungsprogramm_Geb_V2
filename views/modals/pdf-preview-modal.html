    <div id="pdf-preview-modal" class="fixed inset-0 h-screen max-h-screen w-screen overflow-hidden bg-slate-900/80 backdrop-blur-md z-[200] hidden flex-col">
        <div class="h-16 bg-slate-800 text-white flex items-center justify-between px-6 shadow-md shrink-0 z-10">
            <h3 id="pdf-preview-title" class="text-lg font-semibold tracking-tight">PDF Vorschau</h3>
            <div class="flex items-center gap-4">
                <button id="pdf-preview-print-btn" onclick="executePrint('print')"
                    class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg font-medium transition-colors text-sm shadow-lg shadow-slate-900/30">
                    <span class="material-symbols-outlined text-[18px]">print</span>
                    Drucken
                </button>
                <button id="pdf-preview-email-btn"
                    class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium transition-colors text-sm shadow-lg shadow-emerald-900/30">
                    <span class="material-symbols-outlined text-[18px]">mail</span>
                    Per E-Mail senden
                </button>
                <button id="pdf-preview-save-btn" onclick="executePrint('save')"
                    class="flex items-center gap-2 bg-primary hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium transition-colors text-sm shadow-lg shadow-primary/30">
                    <span class="material-symbols-outlined text-[18px]">save</span>
                    Als PDF Speichern
                </button>
                <button id="pdf-preview-close-btn" onclick="closePdfPreview()"
                    class="text-slate-400 hover:text-white p-2 rounded-full transition-colors bg-slate-700 hover:bg-slate-600">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
        </div>

        <div id="pdf-preview-scroll-wrapper" class="flex-1 overflow-y-auto max-h-[calc(100vh-4rem)] p-8 flex justify-center items-start bg-slate-100">
            <!-- This container holds the exact print layout logic so user can verify -->
            <div id="pdf-preview-container" class="bg-white shadow-2xl relative my-4 p-[12mm_15mm] box-border flex flex-col"
                style="width: 210mm; min-height: 297mm;">
                <!-- Content injected here by JS instead of the hidden template -->
            </div>
        </div>
    </div>
