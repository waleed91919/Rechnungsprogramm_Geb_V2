        <!-- Table 3 -->
        <rect x="490" y="0" width="220" height="240" rx="8" fill="#78350f" stroke="#d97706" />
        <text x="600" y="25" font-size="12" font-weight="bold" fill="#fef3c7" text-anchor="middle">Tabelle: positionen</text>
